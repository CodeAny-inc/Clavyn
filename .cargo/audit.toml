# Configuration for `cargo audit`, run by the security-audit job in CI.
#
# Everything listed here is a known advisory that has no drop-in fix today. The
# point of the job is to fail on anything new, so this list should shrink and
# should not grow without a note saying why.
#
# Tracking issue: https://github.com/CodeAny-inc/Clavyn/issues/18
#
# Every entry carries a `# review-by: YYYY-MM-DD` line. CI runs
# `node scripts/verify/check-audit-expiry.mjs`, which fails once a date is
# reached, so no suppression can sit here unexamined.

[advisories]
ignore = [
  # rsa 0.10.0-rc.18, Marvin attack, CVE-2023-49092.
  # No rsa release fixes it. Reaches the tree through russh's `rsa` feature,
  # which stays on so existing RSA keys keep working, and only applies when
  # signing with a stored RSA key. Ed25519 and ECDSA keys are not affected.
  # review-by: 2026-12-31
  "RUSTSEC-2023-0071",

  # russh 0.64.1, agent server signs with confirm-constrained keys without
  # calling `Agent::confirm`.
  # Only `russh::keys::agent::server` is affected, and Clavyn never runs an
  # agent server: agent authentication is refused before any connection is
  # made and agent forwarding is refused when a server opens it. The fix is in
  # russh 0.65, which is not a drop-in bump. On the first key exchange it calls
  # `check_server_key` before `kex_done`, while `SshHandler` takes the RSA hash
  # a host key is pinned under from `kex_done`, so the host key check has to be
  # restructured before the dependency can move.
  # review-by: 2026-12-11
  "RUSTSEC-2026-0495",
]
