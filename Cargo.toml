[workspace]
resolver = "2"
members = ["core", "desktop/src-tauri"]

[workspace.package]
version = "0.1.2-alpha.5"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/your-org/clavyn"
authors = ["Clavyn Contributors"]

[workspace.dependencies]
# Shared core deps
# `default-features = false` drops russh's only default feature, `flate2`.
# Clavyn never negotiates zlib, and without the feature the unbounded
# decompression growth loop is not compiled in at all.
russh = { version = "0.46", default-features = false }
russh-keys = "0.46"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
