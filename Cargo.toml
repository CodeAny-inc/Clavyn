[workspace]
resolver = "2"
members = ["core", "desktop/src-tauri"]

[workspace.package]
version = "0.1.2-alpha.4"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/your-org/clavyn"
authors = ["Clavyn Contributors"]

[workspace.dependencies]
# Shared core deps
russh = "0.46"
russh-keys = "0.46"
# Enumerate the runtime pieces Clavyn and its dependencies actually use. `full`
# additionally compiles the process, signal and io-std drivers, none of which
# any crate in this workspace requires. `net` is listed explicitly because
# russh drives TCP through tokio without declaring the feature itself.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
