# One permission per command in generate_handler! in src/main.rs, granted in
# capabilities/default.json.
#
# Defining any app permission gives the app its own ACL manifest. Tauri checks
# app commands invoked from the app's own pages against the capability files
# only when that manifest exists; without it, any page the app serves, in any
# window, can invoke every registered command. With it, a command runs only
# for a window a capability grants it to.
#
# tests/app_command_acl.rs fails when this file, the handler list and the
# capability disagree.

