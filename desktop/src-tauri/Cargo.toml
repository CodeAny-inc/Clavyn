[package]
name = "clavyn-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clavyn desktop app (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clavyn-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
portable-pty = "0.9"
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"], optional = true }
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"], optional = true }
core-foundation = { version = "=0.10.1", optional = true }
core-foundation-sys = { version = "=0.8.7", optional = true }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext"], optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Keep Touch ID unavailable in ordinary/ad-hoc signed builds. Release builds
# should enable this only after proper Apple signing + Data Protection Keychain
# entitlements are configured and validated.
macos-biometric = [
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:core-foundation",
    "dep:core-foundation-sys",
    "dep:objc2-local-authentication",
]
