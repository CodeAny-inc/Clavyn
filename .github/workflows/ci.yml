name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # GitHub-hosted runners are the default.
  # To switch to self-hosted fallback (e.g. during GitHub infrastructure
  # issues), set the CI_RUNNER_LABELS repo variable to:
  #   ["self-hosted","linux","clavyn"]
  # and the Linux jobs below will use the self-hosted runner instead.
  # macOS jobs always use GitHub-hosted (no macOS self-hosted runner).
  rust-check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          # The Google Chrome apt repo pre-installed on GitHub runners can
          # transiently fail with hash sum mismatches during metadata refreshes.
          # Remove it before apt-get update — none of these Rust dependencies
          # come from Google's repo.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test (core)
        run: cargo test -p clavyn-core
      - name: Cargo test (desktop backend)
        run: cargo test -p clavyn-desktop

  macos-rust-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build (macOS shipping defaults)
        run: cargo build --workspace
      - name: Cargo build (macOS biometric implementation)
        run: cargo build -p clavyn-desktop --features macos-biometric
      - name: Cargo test (macOS biometric implementation)
        run: cargo test -p clavyn-desktop --features macos-biometric

  security-audit:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Audit npm production dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

  frontend-build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npx vue-tsc --noEmit
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        run: npm run build
