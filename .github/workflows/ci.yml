name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # GitHub-hosted runners are the default.
  # To switch to self-hosted fallback (e.g. during GitHub infrastructure
  # issues), set the CI_RUNNER_LABELS repo variable to:
  #   ["self-hosted","linux","clavyn"]
  # and the Linux jobs below will use the self-hosted runner instead.
  # macOS jobs always use GitHub-hosted (no macOS self-hosted runner).
  rust-check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test (core)
        run: cargo test -p clavyn-core
      - name: Cargo test (desktop backend)
        run: cargo test -p clavyn-desktop

  macos-rust-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build (macOS shipping defaults)
        run: cargo build --workspace
      - name: Cargo build (macOS biometric implementation)
        run: cargo build -p clavyn-desktop --features macos-biometric
      - name: Cargo test (macOS biometric implementation)
        run: cargo test -p clavyn-desktop --features macos-biometric

  frontend-build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npx vue-tsc --noEmit
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        run: npm run build

  windows-nsis-smoke:
    name: Windows NSIS smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build NSIS installer
        working-directory: desktop
        shell: pwsh
        run: |
          # Updater artifacts require release signing secrets, which are intentionally
          # unavailable to fork pull requests. This smoke test only needs to prove
          # that the Windows NSIS installer (including its WebView2 bootstrapper)
          # can be bundled successfully.
          npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify NSIS installer was produced
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }

          if (-not $installers) {
            Write-Error "Tauri build completed without producing an NSIS *-setup.exe artifact."
            exit 1
          }

          $installers | ForEach-Object { Write-Host "Produced NSIS installer: $($_.FullName)" }
