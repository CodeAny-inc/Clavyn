name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    # Persistent self-hosted runners are trusted-only. Public fork PRs execute
    # arbitrary repository code, so isolate them on GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-22.04' || fromJSON('["self-hosted","linux","x64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test (core)
        run: cargo test -p opentermius-core
      - name: Cargo test (desktop backend)
        run: cargo test -p opentermius-desktop

  macos-rust-build:
    # Use the persistent macOS runner only for trusted branches/PRs.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-14' || fromJSON('["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build (macOS shipping defaults)
        run: cargo build --workspace
      - name: Cargo build (macOS biometric implementation)
        run: cargo build -p opentermius-desktop --features macos-biometric
      - name: Cargo test (macOS biometric implementation)
        run: cargo test -p opentermius-desktop --features macos-biometric

  frontend-build:
    # Fork PRs never share the long-lived Linux runner used by trusted workflows.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-22.04' || fromJSON('["self-hosted","linux","x64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npx vue-tsc --noEmit
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        run: npm run build
