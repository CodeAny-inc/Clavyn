name: Terminal workspace UI

# Adding a trigger here means revisiting the self-hosted runner gate on the
# job below. That gate asks whether a pull request is in play and whether its
# head repository is this one, so it already covers `pull_request_target`. A
# trigger that carries fork-authored code without a `pull_request` payload —
# `issue_comment` on a pull request, or `workflow_run` — would slip past it.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/terminal-workspace.yml'

permissions:
  contents: read

concurrency:
  group: terminal-workspace-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners are the default.
  # To switch to self-hosted fallback (e.g. during GitHub infrastructure
  # issues), set the CI_RUNNER_LABELS repo variable to:
  #   ["self-hosted","linux","clavyn"]
  #
  # The variable is honoured for pull requests raised from a branch of this
  # repository. A pull request from a fork always lands on a GitHub-hosted
  # runner, whatever the variable says: this job installs and runs code from
  # the pull request (package install scripts, `vite.config.ts`, the Playwright
  # suite). An ephemeral runner contains that; a persistent one hands the
  # author a foothold that outlives the job.
  #
  # The gate keys off the head repository rather than off the event name, so a
  # `pull_request_target` trigger added later cannot quietly reopen it. A head
  # repository that no longer exists reads as null, which does not match this
  # repository, so a deleted fork also stays GitHub-hosted.
  browser-ui:
    runs-on: ${{ fromJSON((!github.event.pull_request.number || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABELS || '"ubuntu-22.04"') || '"ubuntu-22.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install application dependencies
        working-directory: desktop
        # Matches the e2e install below: package install scripts are arbitrary
        # code from the pull request, and nothing in this tree needs them.
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests and production build
        working-directory: desktop
        run: |
          set -o pipefail
          mkdir -p ui-test-results
          npx vue-tsc --noEmit 2>&1 | tee ui-test-results/typecheck.log
          npm test 2>&1 | tee ui-test-results/unit-tests.log
          npm run build 2>&1 | tee ui-test-results/build.log
      - name: Install isolated, pinned browser tooling
        run: |
          # Work around the transient Google Chrome apt metadata issue only on
          # ephemeral GitHub-hosted images. Persistent self-hosted package-source
          # configuration belongs to the runner administrator, not a CI job.
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo python3 - <<'PY'
          from pathlib import Path

          paths = [Path('/etc/apt/sources.list')]
          source_dir = Path('/etc/apt/sources.list.d')
          if source_dir.is_dir():
              paths.extend(source_dir.iterdir())

          for path in paths:
              if not path.is_file():
                  continue
              text = path.read_text(errors='ignore')
              if 'dl.google.com' not in text:
                  continue
              if path.suffix == '.sources':
                  kept = [
                      stanza for stanza in text.split('\n\n')
                      if 'dl.google.com' not in stanza
                  ]
                  updated = '\n\n'.join(kept).rstrip()
              else:
                  kept = [
                      line for line in text.splitlines()
                      if 'dl.google.com' not in line
                  ]
                  updated = '\n'.join(kept).rstrip()
              path.write_text(updated + ('\n' if updated else ''))
          PY
          fi
          npm ci --prefix desktop/e2e --ignore-scripts --no-audit --no-fund
          # Retry browser install as a safety net — the --with-deps flag runs
          # apt-get update internally, which can still transiently fail on
          # other upstream apt mirrors.
          for attempt in 1 2 3; do
            if desktop/e2e/node_modules/.bin/playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1
      - name: Start application
        run: |
          (cd desktop && npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/terminal-vite.log" 2>&1) &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:1420 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/terminal-vite.log"
          exit 1
      - name: Record and verify terminal interactions
        env:
          UI_URL: http://127.0.0.1:1420
          UI_RESULTS: ${{ github.workspace }}/desktop/ui-test-results
          UI_RECORD: '1'
          UI_SLOW_MO: '100'
        run: npm test --prefix desktop/e2e
      - name: Prepare reviewable MP4 recordings
        if: always()
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          for video in desktop/ui-test-results/*.webm; do
            [ -f "$video" ] || continue
            ffmpeg -hide_banner -loglevel error -y -i "$video" -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -movflags +faststart "${video%.webm}.mp4"
          done
      - name: Upload screenshots, recordings, traces and test logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-workspace-ui-${{ github.run_id }}
          retention-days: 14
          path: |
            desktop/ui-test-results/
            !desktop/ui-test-results/raw-video/
            desktop/dist/
            desktop/e2e/
            !desktop/e2e/node_modules/
            ${{ runner.temp }}/terminal-vite.log
