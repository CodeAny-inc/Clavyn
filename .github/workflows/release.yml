name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.2-alpha.1)"
        required: false
      runner_mode:
        description: "Runner mode. Keep GitHub-hosted by default; use self-hosted only to retry a failed trusted release."
        type: choice
        required: false
        default: github
        options:
          - github
          - self-hosted

# Scoped per job below. `prepare` never touches the repository and gets no
# token at all; only the jobs that create or upload release assets get write.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Determine version and release type
  # ──────────────────────────────────────────────
  prepare:
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && '["self-hosted","linux","clavyn"]' || '["ubuntu-22.04"]') }}
    permissions: {}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        # The dispatch inputs reach the shell as environment variables rather
        # than as `${{ }}` substitutions, which would splice their text into
        # the script before bash ever sees it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUNNER_MODE: ${{ inputs.runner_mode || 'github' }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF##*/}"
            VERSION="${TAG#v}"
          fi
          # Everything downstream trusts these two values: they become the
          # release tag, the `gh release upload` target and tauri-action's
          # tagName. `$GITHUB_OUTPUT` is a line-oriented file and the last
          # record for a key wins, so a version carrying a newline writes
          # extra records and repoints `tag` at something the caller chose.
          # Accept only a semantic version; nothing else can express a
          # newline, and no tag this project has ever released is rejected.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to release: '$VERSION' is not a semantic version." >&2
            exit 1
          fi
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *alpha* ]] || [[ "$VERSION" == *beta* ]] || [[ "$VERSION" == *rc* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Releasing $TAG (prerelease=$IS_PRERELEASE, runner_mode=$RUNNER_MODE)"

  # ──────────────────────────────────────────────
  # Build on all platforms
  # ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            github_runner: '["macos-latest"]'
            self_hosted_runner: '["self-hosted","macOS"]'
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            github_runner: '["macos-latest"]'
            self_hosted_runner: '["self-hosted","macOS"]'
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            github_runner: '["ubuntu-22.04"]'
            self_hosted_runner: '["self-hosted","linux","clavyn"]'
            target: x86_64-unknown-linux-gnu
            args: ""
            rust_target: ""
          - platform: windows-latest
            github_runner: '["windows-latest"]'
            self_hosted_runner: '["self-hosted","windows","x64"]'
            target: x86_64-pc-windows-msvc
            args: ""
            rust_target: ""

    # Tag pushes and ordinary manual releases use GitHub-hosted runners. A failed
    # trusted release can be retried via workflow_dispatch with runner_mode=self-hosted.
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && matrix.self_hosted_runner || matrix.github_runner) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        # This job holds the updater signing key. Package install scripts run
        # in the same workspace, before the signing step, and a script that
        # patches the build toolchain under node_modules executes inside the
        # step where the key is in the environment. Nothing in this tree needs
        # them: esbuild resolves its binary through its platform optional
        # dependency and vue-demi's shim already targets Vue 3.
        run: npm ci --ignore-scripts

      # The updater signing key is not available to this job. Everything here
      # runs third-party code (npm packages, build scripts, tauri-action), so
      # the bundles are built unsigned and the `sign` job signs them in a job
      # that runs none of it. With `createUpdaterArtifacts` on and no key the
      # bundler refuses to build, so it is switched off for this build only;
      # the updater artifacts are the installers themselves on Windows and
      # Linux, and the macOS one is packed below.
      - name: Disable updater signing for this build
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/unsigned-updater.json"

      # OS code signing turns on by adding repository secrets and stays off
      # without them. The bundler treats a variable that is set but empty as
      # configured, so each one is exported only when its secret has a value.
      # Code signing happens while bundling, so these credentials, unlike the
      # updater key, are present in the build step.
      - name: Use Apple code signing when configured
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ -n "$APPLE_SIGNING_IDENTITY$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]; then
              echo "::error::Apple signing secrets are set without APPLE_CERTIFICATE. Add the base64 .p12, or drop the others to stay ad-hoc signed."
              exit 1
            fi
            echo "No Apple certificate configured; the app stays ad-hoc signed."
            exit 0
          fi
          # A half-configured set breaks both macOS builds rather than leaving
          # them ad-hoc signed: a certificate with no identity leaves the
          # bundler on the "-" from tauri.conf.json and fails with `certificate
          # ... does not match provided identity "-"`, and an Apple ID without
          # a team id fails with MissingTeamId. Name the missing secret here,
          # before a build that takes twenty minutes to reach the bundler.
          missing=""
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          notarize=""
          if [ -n "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]; then
            notarize="yes"
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error::Apple code signing is configured but incomplete, missing:$missing"
            exit 1
          fi
          [ -n "$notarize" ] || echo "No notarization credentials; the app is signed but not notarized."
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 16)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            fi
          done

      - name: Use Authenticode signing when configured
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            if ($env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Output "::error::WINDOWS_CERTIFICATE_PASSWORD is set without WINDOWS_CERTIFICATE."
              exit 1
            }
            Write-Output "No Authenticode certificate configured; the installer stays unsigned."
            exit 0
          }
          # ConvertTo-SecureString throws on an empty string, so an unset
          # password would otherwise fail the build with a parameter-binding
          # error that says nothing about which secret is missing.
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::error::WINDOWS_CERTIFICATE is set without WINDOWS_CERTIFICATE_PASSWORD. Export the .pfx with a password and add it as a secret."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "authenticode.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # The certificate and its private key stay in the runner's user store
          # until the cleanup step removes them. On a self-hosted machine that
          # store outlives the job, so the thumbprint is handed on and the
          # removal runs whether or not the build succeeds.
          "AUTHENTICODE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $config = Join-Path $env:RUNNER_TEMP "authenticode.json"
          # tsp selects RFC 3161 timestamping (signtool /tr /td sha256); without
          # it the bundler falls back to the legacy Authenticode /t timestamp,
          # which does not carry the SHA-256 digest this signature uses.
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
              tsp = $true
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $config
          "SIGNING_CONFIG_ARGS=--config $config" >> $env:GITHUB_ENV

      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Clavyn ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Clavyn ${{ needs.prepare.outputs.version }} — see assets below."
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --config ${{ runner.temp }}/unsigned-updater.json ${{ env.SIGNING_CONFIG_ARGS }}

      - name: Remove the Authenticode certificate from the runner store
        # The macOS keychain the bundler creates is temporary and goes with the
        # job. This store is not: on a self-hosted Windows runner the imported
        # key would stay available to every later job on that machine.
        if: ${{ always() && matrix.platform == 'windows-latest' && env.AUTHENTICODE_THUMBPRINT != '' }}
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\$env:AUTHENTICODE_THUMBPRINT" -DeleteKey -Force

      - name: Pack the macOS updater archive
        # The bundler builds `<app>.app.tar.gz` only alongside a signature, so
        # it is packed here from the finished bundle in the same shape: a gzip
        # tar holding the `.app` directory. Named as tauri-action names it.
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          case "$RUST_TARGET" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin) ARCH=x64 ;;
            *) echo "unexpected macOS target '$RUST_TARGET'" >&2; exit 1 ;;
          esac
          BUNDLE_DIR="$GITHUB_WORKSPACE/target/$RUST_TARGET/release/bundle/macos"
          ARCHIVE="$RUNNER_TEMP/Clavyn_${VERSION}_${ARCH}.app.tar.gz"
          # No AppleDouble `._` entries for extended attributes.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$ARCHIVE" -C "$BUNDLE_DIR" Clavyn.app
          gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"

  # ──────────────────────────────────────────────
  # Build the signer binary
  # ──────────────────────────────────────────────
  # `cargo install tauri-cli --locked` compiles tauri-cli's lockfile (~850
  # crates) including their build scripts and proc-macros, none of which may
  # run on the machine that holds the key. This job produces the binary on an
  # isolated runner, publishes it as an artifact and exports its sha256 so
  # `sign` can verify the exact bytes it is about to execute.
  signer-tool:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      signer_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Build the Tauri signer
        run: |
          cargo install tauri-cli --version 2.11.4 --locked --root "$RUNNER_TEMP/tauri-cli"
          install -m 755 "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri" "$RUNNER_TEMP/cargo-tauri"

      - name: Publish the signer digest
        id: digest
        run: sha256sum "$RUNNER_TEMP/cargo-tauri" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Upload the signer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-signer
          path: ${{ runner.temp }}/cargo-tauri
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────
  # Sign the updater artifacts
  # ──────────────────────────────────────────────
  # The only job that holds the updater signing key, which is the sole root of
  # trust for every installed client's auto-update. It checks out no code and
  # installs nothing: it fetches the signer binary built by `signer-tool`,
  # verifies it against the digest that job exported, and signs the release
  # assets the updater installs — the key only ever shares a step with that
  # verified binary. It always runs on an ephemeral GitHub-hosted runner,
  # including when `runner_mode` sends the builds to self-hosted machines.
  sign:
    needs: [prepare, build, signer-tool]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the Tauri signer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tauri-signer
          path: ${{ runner.temp }}/signer

      - name: Verify the signer digest
        env:
          EXPECTED_SHA256: ${{ needs.signer-tool.outputs.signer_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/signer/cargo-tauri" | sha256sum --check
          chmod +x "$RUNNER_TEMP/signer/cargo-tauri"

      - name: Download the updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          # The exact files this version's release must carry; `gh` fails the
          # step if any expected name is absent. A glob would sign stray
          # assets too — e.g. a leftover `Clavyn_x64.app.tar.gz` from another
          # version — and could pair a signature with the wrong file.
          expected=(
            "Clavyn_${VERSION}_aarch64.app.tar.gz"
            "Clavyn_${VERSION}_x64.app.tar.gz"
            "Clavyn_${VERSION}_amd64.AppImage"
            "Clavyn_${VERSION}_amd64.deb"
            "Clavyn-${VERSION}-1.x86_64.rpm"
            "Clavyn_${VERSION}_x64-setup.exe"
          )
          for name in "${expected[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "$RUNNER_TEMP/assets" --clobber --pattern "$name"
          done
          ls -la "$RUNNER_TEMP/assets"

      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in "$RUNNER_TEMP"/assets/*; do
            "$RUNNER_TEMP/signer/cargo-tauri" signer sign "$file"
          done

      - name: Verify signatures against the updater pubkey
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # `signer sign` never checks the key against `plugins.updater.pubkey`,
          # so a rotated or mismatched secret would ship silently and break
          # auto-update on every client. Verify each .sig before uploading.
          gh api "repos/$GITHUB_REPOSITORY/contents/desktop/src-tauri/tauri.conf.json?ref=$RELEASE_TAG" \
            --jq .content | base64 -d > "$RUNNER_TEMP/tauri.conf.json"
          python3 << 'PYEOF'
          import base64, glob, json, os, subprocess, sys

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(f"{runner_temp}/tauri.conf.json") as f:
              pubkey_cfg = json.load(f)["plugins"]["updater"]["pubkey"]

          # The config value is the base64 of a minisign public-key file; its
          # key line decodes to [alg | keynum(8) | ed25519 key(32)].
          pub_text = base64.b64decode(pubkey_cfg).decode()
          pub = base64.b64decode(
              next(l for l in pub_text.splitlines() if l and not l.startswith("untrusted")))
          if pub[:2] != b"Ed" or len(pub) != 42:
              sys.exit("unexpected updater pubkey format in tauri.conf.json")
          keynum = pub[2:10]
          with open(f"{runner_temp}/pubkey.der", "wb") as f:
              f.write(bytes.fromhex("302a300506032b6570032100") + pub[10:])

          failed = []
          for path in sorted(glob.glob(f"{runner_temp}/assets/*")):
              if path.endswith(".sig"):
                  continue
              name = os.path.basename(path)
              sig_path = path + ".sig"
              if not os.path.exists(sig_path):
                  print(f"{name}: missing .sig")
                  failed.append(name)
                  continue
              # Each .sig is the base64 of a minisign signature box; its
              # signature line decodes to [alg | keynum(8) | ed25519 sig(64)].
              box = base64.b64decode(open(sig_path, "rb").read()).decode()
              sig = base64.b64decode(
                  next(l for l in box.splitlines()
                       if l and not l.startswith(("untrusted", "trusted"))))
              if sig[:2] not in (b"Ed", b"ED") or len(sig) != 74 or sig[2:10] != keynum:
                  print(f"{name}: signature algorithm or keynum mismatch")
                  failed.append(name)
                  continue
              # Minisign's "ED" covers the BLAKE2b-512 digest of the file;
              # "Ed" covers the file itself.
              if sig[:2] == b"ED":
                  with open(f"{runner_temp}/digest.bin", "wb") as f:
                      f.write(subprocess.run(
                          ["openssl", "dgst", "-blake2b512", "-binary", path],
                          capture_output=True, check=True).stdout)
                  msg_path = f"{runner_temp}/digest.bin"
              else:
                  msg_path = path
              with open(f"{runner_temp}/sig.bin", "wb") as f:
                  f.write(sig[10:])
              r = subprocess.run(
                  ["openssl", "pkeyutl", "-verify", "-rawin",
                   "-in", msg_path,
                   "-sigfile", f"{runner_temp}/sig.bin",
                   "-pubin", "-inkey", f"{runner_temp}/pubkey.der",
                   "-keyform", "DER"],
                  capture_output=True, text=True)
              if r.returncode == 0:
                  print(f"{name}: signature verified")
              else:
                  print(f"{name}: {r.stderr.strip() or 'signature verification failed'}")
                  failed.append(name)

          if failed:
              sys.exit(f"signature verification failed for: {', '.join(failed)}")
          PYEOF

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/assets/*.sig --clobber --repo "$GITHUB_REPOSITORY"

  # ──────────────────────────────────────────────
  # Generate and upload latest.json (update manifest)
  # ──────────────────────────────────────────────
  publish-manifest:
    needs: [prepare, sign]
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && '["self-hosted","linux","clavyn"]' || '["ubuntu-22.04"]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all release assets
        # `tag` and `version` derive from the dispatch input, so they carry the
        # same taint and are passed in the same way.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          gh release download "$TAG" --dir ./assets --clobber
          echo "Downloaded assets:"
          ls -la ./assets
          echo "---"
          echo "Sig files:"
          ls -la ./assets/*.sig 2>/dev/null || echo "NO .sig FILES FOUND"

      - name: Generate latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Build the manifest with Python for proper JSON escaping. The `sign`
          # job signs an exact set of files for this version, so pair each
          # signature with the file it was produced from by name — globbing
          # could pick a signature and a URL from different files, and a stray
          # asset matching the pattern would shadow the real one.
          python3 << 'PYEOF'
          import json, os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          expected = {
              "darwin-aarch64": f"Clavyn_{version}_aarch64.app.tar.gz",
              "darwin-x86_64": f"Clavyn_{version}_x64.app.tar.gz",
              "linux-x86_64": f"Clavyn_{version}_amd64.AppImage",
              "windows-x86_64": f"Clavyn_{version}_x64-setup.exe",
          }

          platforms = {}
          missing = []
          for platform, filename in expected.items():
              sig_path = f"./assets/{filename}.sig"
              if not os.path.exists(f"./assets/{filename}") or not os.path.exists(sig_path):
                  print(f"WARNING: {platform} missing ({filename})")
                  missing.append(platform)
                  continue
              with open(sig_path) as f:
                  sig = f.read().strip()
              url = f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              platforms[platform] = {"signature": sig, "url": url}
              print(f"{platform}: {url}")

          manifest = {
              "version": version,
              "notes": f"Clavyn {version}",
              "pub_date": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms
          }

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("\nGenerated latest.json:")
          print(json.dumps(manifest, indent=2))

          if missing:
              print(f"\nERROR: missing assets for: {', '.join(missing)}")
              print("All assets:")
              for f in sorted(os.listdir("./assets")):
                  print(f"  {f}")
              exit(1)
          PYEOF

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG"

      - name: Publish SHA256SUMS
        # One checksum line per release asset, in the format `sha256sum -c`
        # and `shasum -a 256 -c` read, so a download can be checked against
        # what this release published. It runs last, once every installer,
        # signature and latest.json is in place.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          rm -rf ./checksummed
          gh release download "$RELEASE_TAG" --dir ./checksummed --clobber
          rm -f ./checksummed/SHA256SUMS
          (cd ./checksummed && sha256sum -- * | sort -k 2) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
