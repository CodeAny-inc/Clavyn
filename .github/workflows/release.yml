name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.2-alpha.1)"
        required: false

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Determine version and release type
  # ──────────────────────────────────────────────
  prepare:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF##*/}"
            VERSION="${TAG#v}"
          fi
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *alpha* ]] || [[ "$VERSION" == *beta* ]] || [[ "$VERSION" == *rc* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Releasing $TAG (prerelease=$IS_PRERELEASE)"

  # ──────────────────────────────────────────────
  # Build on all platforms
  # ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: '["self-hosted","macOS"]'
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            runner: '["self-hosted","macOS"]'
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            runner: '["self-hosted","linux","x64"]'
            target: x86_64-unknown-linux-gnu
            args: ""
            rust_target: ""
          - platform: windows-latest
            runner: '["self-hosted","windows","x64"]'
            target: x86_64-pc-windows-msvc
            args: ""
            rust_target: ""

    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "OpenTermius ${{ needs.prepare.outputs.tag }}"
          releaseBody: "OpenTermius ${{ needs.prepare.outputs.version }} — see assets below."
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          args: ${{ matrix.args }}

      - name: Upload .sig files to release
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          # Fallback: upload any .sig files that tauri-action didn't upload.
          # With createUpdaterArtifacts: true, tauri-action should handle this,
          # but we keep this as a safety net.
          echo "Working directory: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "RUST_TARGET: ${RUST_TARGET}"

          if [ -n "$RUST_TARGET" ]; then
            TARGET_DIR="$GITHUB_WORKSPACE/target/$RUST_TARGET/release/bundle"
          else
            TARGET_DIR="$GITHUB_WORKSPACE/target/release/bundle"
          fi
          echo "Expected bundle dir: $TARGET_DIR"

          ALT_DIRS="$GITHUB_WORKSPACE/target/release/bundle $GITHUB_WORKSPACE/desktop/src-tauri/target/release/bundle"
          if [ -n "$RUST_TARGET" ]; then
            ALT_DIRS="$ALT_DIRS $GITHUB_WORKSPACE/target/$RUST_TARGET/release/bundle $GITHUB_WORKSPACE/desktop/src-tauri/target/$RUST_TARGET/release/bundle"
          fi

          upload_sig() {
            local sigfile="$1"
            local basename
            basename=$(basename "$sigfile")
            # macOS .app.tar.gz.sig → rename to include arch
            if [ "$basename" = "OpenTermius.app.tar.gz.sig" ] && [ -n "$RUST_TARGET" ]; then
              local arch=""
              if [ "$RUST_TARGET" = "aarch64-apple-darwin" ]; then
                arch="aarch64"
              elif [ "$RUST_TARGET" = "x86_64-apple-darwin" ]; then
                arch="x64"
              fi
              if [ -n "$arch" ]; then
                local newname="OpenTermius_${arch}.app.tar.gz.sig"
                echo "Uploading: $sigfile as $newname"
                cp "$sigfile" "/tmp/$newname"
                gh release upload "$TAG" "/tmp/$newname" --clobber
                return
              fi
            fi
            echo "Uploading: $sigfile"
            gh release upload "$TAG" "$sigfile" --clobber
          }

          UPLOADED=0
          for dir in $ALT_DIRS; do
            if [ -d "$dir" ]; then
              echo "Searching in: $dir"
              find "$dir" -name "*.sig" -type f -exec echo "Found: {}" \; 2>/dev/null || true
              SIG_LIST=$(find "$dir" -name "*.sig" -type f 2>/dev/null || true)
              if [ -n "$SIG_LIST" ]; then
                echo "$SIG_LIST" | while IFS= read -r sigfile; do
                  upload_sig "$sigfile"
                done
                UPLOADED=1
              fi
            fi
          done

          if [ "$UPLOADED" -eq 0 ]; then
            echo "No .sig files found in expected dirs. Searching entire target..."
            SIG_LIST=$(find "$GITHUB_WORKSPACE/target" -name "*.sig" -type f 2>/dev/null || true)
            if [ -n "$SIG_LIST" ]; then
              echo "$SIG_LIST" | while IFS= read -r sigfile; do
                upload_sig "$sigfile"
              done
              UPLOADED=1
            fi
          fi

          if [ "$UPLOADED" -eq 0 ]; then
            echo "WARNING: No .sig files were uploaded"
            echo "Listing $TARGET_DIR:"
            ls -laR "$TARGET_DIR" 2>/dev/null || echo "Bundle directory not found"
          fi

          echo "Done uploading .sig files"

  # ──────────────────────────────────────────────
  # Generate and upload latest.json (update manifest)
  # ──────────────────────────────────────────────
  publish-manifest:
    needs: [prepare, build]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release download "$TAG" --dir ./assets --clobber
          echo "Downloaded assets:"
          ls -la ./assets
          echo "---"
          echo "Sig files:"
          ls -la ./assets/*.sig 2>/dev/null || echo "NO .sig FILES FOUND"

      - name: Generate latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Build the manifest with Python for proper JSON escaping
          # Uses glob patterns to find .sig files regardless of exact naming
          python3 << 'PYEOF'
          import json, os, glob

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          def read_sig(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except FileNotFoundError:
                  return ""

          def find_sig(pattern):
              matches = glob.glob(f"./assets/{pattern}")
              if matches:
                  return read_sig(matches[0])
              return ""

          def find_asset_url(pattern):
              """Find the actual asset name on the release and return its URL."""
              matches = glob.glob(f"./assets/{pattern}")
              if matches:
                  filename = os.path.basename(matches[0])
                  return f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              return None

          platforms = {}

          # macOS aarch64 — .app.tar.gz has NO version in filename
          # e.g. OpenTermius_aarch64.app.tar.gz
          sig = find_sig("*aarch64.app.tar.gz.sig")
          url = find_asset_url("*aarch64.app.tar.gz")
          if sig and url:
              platforms["darwin-aarch64"] = {"signature": sig, "url": url}
              print(f"darwin-aarch64: {url}")
          else:
              print(f"WARNING: darwin-aarch64 missing (sig={bool(sig)}, url={url})")

          # macOS x86_64 — .app.tar.gz has NO version in filename
          # e.g. OpenTermius_x64.app.tar.gz
          sig = find_sig("*x64.app.tar.gz.sig")
          url = find_asset_url("*x64.app.tar.gz")
          if sig and url:
              platforms["darwin-x86_64"] = {"signature": sig, "url": url}
              print(f"darwin-x86_64: {url}")
          else:
              print(f"WARNING: darwin-x86_64 missing (sig={bool(sig)}, url={url})")

          # Linux x86_64 — AppImage signed directly
          # e.g. OpenTermius_0.1.1-alpha.23_amd64.AppImage
          sig = find_sig("*amd64.AppImage.sig")
          url = find_asset_url("*amd64.AppImage")
          if sig and url:
              platforms["linux-x86_64"] = {"signature": sig, "url": url}
              print(f"linux-x86_64: {url}")
          else:
              print(f"WARNING: linux-x86_64 missing (sig={bool(sig)}, url={url})")

          # Windows x86_64 — NSIS setup exe signed directly
          # e.g. OpenTermius_0.1.1-alpha.23_x64-setup.exe
          sig = find_sig("*x64-setup.exe.sig")
          url = find_asset_url("*x64-setup.exe")
          if sig and url:
              platforms["windows-x86_64"] = {"signature": sig, "url": url}
              print(f"windows-x86_64: {url}")
          else:
              print(f"WARNING: windows-x86_64 missing (sig={bool(sig)}, url={url})")

          manifest = {
              "version": version,
              "notes": f"OpenTermius {version}",
              "pub_date": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms
          }

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("\nGenerated latest.json:")
          print(json.dumps(manifest, indent=2))

          if not platforms:
              print("\nERROR: No platforms found! Check that .sig files were uploaded.")
              print("Available .sig files:")
              for f in sorted(glob.glob("./assets/*.sig")):
                  print(f"  {f}")
              print("All assets:")
              for f in sorted(os.listdir("./assets")):
                  print(f"  {f}")
              exit(1)
          PYEOF

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG"
