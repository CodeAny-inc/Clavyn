name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.2-alpha.1)"
        required: false
      runner_mode:
        description: "Runner mode. Keep GitHub-hosted by default; use self-hosted only to retry a failed trusted release."
        type: choice
        required: false
        default: github
        options:
          - github
          - self-hosted

# Scoped per job below. `prepare` never touches the repository and gets no
# token at all; only the jobs that create or upload release assets get write.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Determine version and release type
  # ──────────────────────────────────────────────
  prepare:
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && '["self-hosted","linux","clavyn"]' || '["ubuntu-22.04"]') }}
    permissions: {}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        # The dispatch inputs reach the shell as environment variables rather
        # than as `${{ }}` substitutions, which would splice their text into
        # the script before bash ever sees it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUNNER_MODE: ${{ inputs.runner_mode || 'github' }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF##*/}"
            VERSION="${TAG#v}"
          fi
          # Everything downstream trusts these two values: they become the
          # release tag, the `gh release upload` target and tauri-action's
          # tagName. `$GITHUB_OUTPUT` is a line-oriented file and the last
          # record for a key wins, so a version carrying a newline writes
          # extra records and repoints `tag` at something the caller chose.
          # Accept only a semantic version; nothing else can express a
          # newline, and no tag this project has ever released is rejected.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to release: '$VERSION' is not a semantic version." >&2
            exit 1
          fi
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *alpha* ]] || [[ "$VERSION" == *beta* ]] || [[ "$VERSION" == *rc* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Releasing $TAG (prerelease=$IS_PRERELEASE, runner_mode=$RUNNER_MODE)"

  # ──────────────────────────────────────────────
  # Build on all platforms
  # ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            github_runner: '["macos-latest"]'
            self_hosted_runner: '["self-hosted","macOS"]'
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            github_runner: '["macos-latest"]'
            self_hosted_runner: '["self-hosted","macOS"]'
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            github_runner: '["ubuntu-22.04"]'
            self_hosted_runner: '["self-hosted","linux","clavyn"]'
            target: x86_64-unknown-linux-gnu
            args: ""
            rust_target: ""
          - platform: windows-latest
            github_runner: '["windows-latest"]'
            self_hosted_runner: '["self-hosted","windows","x64"]'
            target: x86_64-pc-windows-msvc
            args: ""
            rust_target: ""

    # Tag pushes and ordinary manual releases use GitHub-hosted runners. A failed
    # trusted release can be retried via workflow_dispatch with runner_mode=self-hosted.
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && matrix.self_hosted_runner || matrix.github_runner) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        # This job holds the updater signing key. Package install scripts run
        # in the same workspace, before the signing step, and a script that
        # patches the build toolchain under node_modules executes inside the
        # step where the key is in the environment. Nothing in this tree needs
        # them: esbuild resolves its binary through its platform optional
        # dependency and vue-demi's shim already targets Vue 3.
        run: npm ci --ignore-scripts

      # The updater signing key is not available to this job. Everything here
      # runs third-party code (npm packages, build scripts, tauri-action), so
      # the bundles are built unsigned and the `sign` job signs them in a job
      # that runs none of it. With `createUpdaterArtifacts` on and no key the
      # bundler refuses to build, so it is switched off for this build only;
      # the updater artifacts are the installers themselves on Windows and
      # Linux, and the macOS one is packed below.
      - name: Disable updater signing for this build
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/unsigned-updater.json"

      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Clavyn ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Clavyn ${{ needs.prepare.outputs.version }} — see assets below."
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config ${{ runner.temp }}/unsigned-updater.json

      - name: Pack the macOS updater archive
        # The bundler builds `<app>.app.tar.gz` only alongside a signature, so
        # it is packed here from the finished bundle in the same shape: a gzip
        # tar holding the `.app` directory. Named as tauri-action names it.
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          case "$RUST_TARGET" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin) ARCH=x64 ;;
            *) echo "unexpected macOS target '$RUST_TARGET'" >&2; exit 1 ;;
          esac
          BUNDLE_DIR="$GITHUB_WORKSPACE/target/$RUST_TARGET/release/bundle/macos"
          ARCHIVE="$RUNNER_TEMP/Clavyn_${VERSION}_${ARCH}.app.tar.gz"
          # No AppleDouble `._` entries for extended attributes.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$ARCHIVE" -C "$BUNDLE_DIR" Clavyn.app
          gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"

  # ──────────────────────────────────────────────
  # Sign the updater artifacts
  # ──────────────────────────────────────────────
  # The only job that holds the updater signing key, which is the sole root of
  # trust for every installed client's auto-update. It checks out no code,
  # installs no npm packages and runs no third-party actions: it installs the
  # Tauri CLI from crates.io at a pinned version with its own lockfile, downloads
  # the release assets the updater installs, signs them and uploads the
  # signatures. It always runs on an ephemeral GitHub-hosted runner, including
  # when `runner_mode` sends the builds to self-hosted machines.
  sign:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install the Tauri signer
        run: cargo install tauri-cli --version 2.11.4 --locked --root "$RUNNER_TEMP/tauri-cli"

      - name: Download the updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"             --pattern '*.app.tar.gz' --pattern '*.AppImage' --pattern '*.deb'             --pattern '*.rpm' --pattern '*-setup.exe'
          ls -la "$RUNNER_TEMP/assets"

      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No updater artifacts to sign." >&2
            exit 1
          fi
          export PATH="$RUNNER_TEMP/tauri-cli/bin:$PATH"
          for file in "${files[@]}"; do
            cargo tauri signer sign "$file"
          done

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/assets/*.sig --clobber --repo "$GITHUB_REPOSITORY"

  # ──────────────────────────────────────────────
  # Generate and upload latest.json (update manifest)
  # ──────────────────────────────────────────────
  publish-manifest:
    needs: [prepare, sign]
    runs-on: ${{ fromJSON(inputs.runner_mode == 'self-hosted' && '["self-hosted","linux","clavyn"]' || '["ubuntu-22.04"]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all release assets
        # `tag` and `version` derive from the dispatch input, so they carry the
        # same taint and are passed in the same way.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          gh release download "$TAG" --dir ./assets --clobber
          echo "Downloaded assets:"
          ls -la ./assets
          echo "---"
          echo "Sig files:"
          ls -la ./assets/*.sig 2>/dev/null || echo "NO .sig FILES FOUND"

      - name: Generate latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Build the manifest with Python for proper JSON escaping
          # Uses glob patterns to find .sig files regardless of exact naming
          python3 << 'PYEOF'
          import json, os, glob

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          def read_sig(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except FileNotFoundError:
                  return ""

          def find_sig(pattern):
              matches = glob.glob(f"./assets/{pattern}")
              if matches:
                  return read_sig(matches[0])
              return ""

          def find_asset_url(pattern):
              """Find the actual asset name on the release and return its URL."""
              matches = glob.glob(f"./assets/{pattern}")
              if matches:
                  filename = os.path.basename(matches[0])
                  return f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              return None

          platforms = {}

          # macOS aarch64 — .app.tar.gz has NO version in filename
          # e.g. Clavyn_aarch64.app.tar.gz
          sig = find_sig("*aarch64.app.tar.gz.sig")
          url = find_asset_url("*aarch64.app.tar.gz")
          if sig and url:
              platforms["darwin-aarch64"] = {"signature": sig, "url": url}
              print(f"darwin-aarch64: {url}")
          else:
              print(f"WARNING: darwin-aarch64 missing (sig={bool(sig)}, url={url})")

          # macOS x86_64 — .app.tar.gz has NO version in filename
          # e.g. Clavyn_x64.app.tar.gz
          sig = find_sig("*x64.app.tar.gz.sig")
          url = find_asset_url("*x64.app.tar.gz")
          if sig and url:
              platforms["darwin-x86_64"] = {"signature": sig, "url": url}
              print(f"darwin-x86_64: {url}")
          else:
              print(f"WARNING: darwin-x86_64 missing (sig={bool(sig)}, url={url})")

          # Linux x86_64 — AppImage signed directly
          # e.g. Clavyn_0.1.1-alpha.23_amd64.AppImage
          sig = find_sig("*amd64.AppImage.sig")
          url = find_asset_url("*amd64.AppImage")
          if sig and url:
              platforms["linux-x86_64"] = {"signature": sig, "url": url}
              print(f"linux-x86_64: {url}")
          else:
              print(f"WARNING: linux-x86_64 missing (sig={bool(sig)}, url={url})")

          # Windows x86_64 — NSIS setup exe signed directly
          # e.g. Clavyn_0.1.1-alpha.23_x64-setup.exe
          sig = find_sig("*x64-setup.exe.sig")
          url = find_asset_url("*x64-setup.exe")
          if sig and url:
              platforms["windows-x86_64"] = {"signature": sig, "url": url}
              print(f"windows-x86_64: {url}")
          else:
              print(f"WARNING: windows-x86_64 missing (sig={bool(sig)}, url={url})")

          manifest = {
              "version": version,
              "notes": f"Clavyn {version}",
              "pub_date": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms
          }

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("\nGenerated latest.json:")
          print(json.dumps(manifest, indent=2))

          if not platforms:
              print("\nERROR: No platforms found! Check that .sig files were uploaded.")
              print("Available .sig files:")
              for f in sorted(glob.glob("./assets/*.sig")):
                  print(f"  {f}")
              print("All assets:")
              for f in sorted(os.listdir("./assets")):
                  print(f"  {f}")
              exit(1)
          PYEOF

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG"
