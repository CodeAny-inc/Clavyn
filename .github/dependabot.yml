version: 2

updates:
  # Application dependencies. The production tree is gated by `npm audit
  # --omit=dev` in CI; the development tree is only reported, so this is what
  # actually moves it.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript 7.x is the Go-native compiler line and ships no JS API
      # (lib/tsc), which vue-tsc requires. Major bumps need a manual check
      # against the vue-tsc/Volar support matrix; minor and patch still flow.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # tailwindcss 4.x is a re-integration, not a bump: the PostCSS plugin
      # moved to @tailwindcss/postcss, the `@tailwind` directives are gone,
      # and the JS config is no longer auto-loaded. A version-only bump
      # breaks every job that runs PostCSS (vitest, vite build, tauri
      # build), so the major upgrade lands as a manual migration instead.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
    groups:
      desktop-minor-and-patch:
        update-types:
          - minor
          - patch
      # vite, vitest and @vitejs/plugin-vue must move as one unit: vitest
      # depends on a single vite major and plugin-vue peers one, so bumping
      # vite alone produces a lockfile `npm ci` rejects with ERESOLVE.
      vite-toolchain:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
        update-types:
          - major

  # Browser test harness. Separate lockfile, never covered by the desktop
  # entry above.
  - package-ecosystem: npm
    directory: /desktop/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e-minor-and-patch:
        update-types:
          - minor
          - patch

  # Cargo workspace root: core plus desktop/src-tauri.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs, which nothing else moves. Without this
  # entry a pinned action stays on the commit it was pinned to forever,
  # security releases included. Dependabot rewrites both the SHA and the
  # version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
